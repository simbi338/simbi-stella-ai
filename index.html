<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simbi Stella AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 90%;
            max-width: 700px;
            height: 80vh;
            background: #1e293b;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #2563eb;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            background: #334155;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #0f172a;
        }

        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            outline: none;
        }

        button {
            margin-left: 10px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="header">
            🤖 Simbi Stella AI
        </div>

        <div class="messages" id="messages">
            <div class="message">
                Hello! 👋 I am Simbi Stella AI. How can I help you?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask Simbi Stella AI...">
            <button onclick="sendMessage()">Send</button>
        </div>

    </div>

    <script>
        function sendMessage() {
            let input = document.getElementById("userInput");
            let messages = document.getElementById("messages");

            if (input.value.trim() === "") {
                return;
            }

            let userMessage = document.createElement("div");
            userMessage.className = "message";
            userMessage.innerText = "You: " + input.value;

            messages.appendChild(userMessage);

            input.value = "";
            messages.scrollTop = messages.scrollHeight;
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simbi Stella AI</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 90%;
            max-width: 700px;
            height: 80vh;
            background: #1e293b;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            background: #2563eb;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
        }

        .messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
        }

        .message {
            background: #334155;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .input-area {
            display: flex;
            padding: 15px;
            background: #0f172a;
        }

        input {
            flex: 1;
            padding: 14px;
            border: none;
            border-radius: 10px;
            outline: none;
        }

        button {
            margin-left: 10px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

    <div class="chat-container">

        <div class="header">
            🤖 Simbi Stella AI
        </div>

        <div class="messages" id="messages">
            <div class="message">
                Hello! 👋 I am Simbi Stella AI. How can I help you?
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="userInput" placeholder="Ask Simbi Stella AI...">
           <button type="button" onclick="sendMessage()">Send</button>
        </div>

    </div>

    <script>
        
async function sendMessage() {
    let input = document.getElementById("userInput");
    let messages = document.getElementById("messages");
    

    let message = input.value.trim();

    if (message === "") {
        return;
    }

    // Display user's message
    let userMessage = document.createElement("div");
    userMessage.className = "message";
    userMessage.innerText = "You: " + message;

    messages.appendChild(userMessage);

    input.value = "";
    messages.scrollTop = messages.scrollHeight;

    // Show loading message
    let loading = document.createElement("div");
    loading.className = "message";
    loading.innerText = "Simbi Stella AI is thinking...";

    messages.appendChild(loading);

    try {
        // Connect to Render backend
        const response = await fetch(
            "https://simbi-stella-ai-backend.onrender.com/chat",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    message: message
                })
            }
        );

        const data = await response.json();

        loading.remove();

        if (!response.ok) {
            throw new Error(data.error || "AI request failed");
        }

        // Display AI response
        let aiMessage = document.createElement("div");
        aiMessage.className = "message";
        aiMessage.innerText =
            "Simbi Stella AI: " + data.reply;

        messages.appendChild(aiMessage);

    } catch (error) {
        loading.innerText =
            "Error: " + error.message;

        console.error("Chat error:", error);
    }

    messages.scrollTop = messages.scrollHeight;
}

</script>
</body>
</html>
